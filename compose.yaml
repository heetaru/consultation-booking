name: consultation-booking

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: consultation_booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d consultation_booking"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
